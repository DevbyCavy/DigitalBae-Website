<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E1729" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default SEO + social preview (each page overrides title/description at runtime).
         %VITE_SITE_URL% is replaced at build time from .env -->
    <title data-default-seo>Digital Bae | Tafadzwa L. Gotora, Author, Digital Marketer &amp; Speaker</title>
    <meta data-default-seo name="description" content="Digital Bae is the platform of Tafadzwa L. Gotora: author, multi-award-winning digital marketer and speaker on digital transformation, leadership and personal branding." />
    <link data-default-seo rel="canonical" href="%VITE_SITE_URL%/" />
    <meta data-default-seo property="og:type" content="website" />
    <meta data-default-seo property="og:site_name" content="Digital Bae" />
    <meta data-default-seo property="og:locale" content="en_GB" />
    <meta data-default-seo property="og:url" content="%VITE_SITE_URL%/" />
    <meta data-default-seo property="og:title" content="Digital Bae | Bold Ideas. Digital Influence. Meaningful Impact." />
    <meta data-default-seo property="og:description" content="The platform of Tafadzwa L. Gotora: author, multi-award-winning digital marketer and speaker." />
    <meta data-default-seo property="og:image" content="%VITE_SITE_URL%/images/og-image.jpg" />
    <meta data-default-seo property="og:image:width" content="1200" />
    <meta data-default-seo property="og:image:height" content="630" />
    <meta data-default-seo property="og:image:alt" content="Digital Bae: Tafadzwa L. Gotora in a pink suit beside the words Bold ideas, Digital influence, Meaningful impact" />
    <meta data-default-seo name="twitter:card" content="summary_large_image" />
    <meta data-default-seo name="twitter:image" content="%VITE_SITE_URL%/images/og-image.jpg" />

  </head>
  <body>
    <div id="root"></div>
    <noscript>Digital Bae requires JavaScript to display this site.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
